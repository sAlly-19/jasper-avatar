appId: com.jasper.avatar
productName: Jasper AI
copyright: Copyright © 2026 Jasper Team

directories:
  output: release

files:
  - out/**/*
  - package.json
  - "!**/node_modules/**/*.map"
  - "!**/node_modules/**/{test,tests,__tests__}/**"

extraResources:
  - from: src/main/autonomous/scripts
    to: scripts
    filter:
      - "*.ps1"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Jasper AI
  artifactName: Jasper-AI-Setup-${version}.${ext}

portable:
  artifactName: Jasper-AI-${version}-Portable.${ext}

publish:
  provider: generic
  url: https://github.com/sAlly-19/jasper-avatar-releases/releases/latest/download

electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

